<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Guitar Tuner</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="game">

        <!-- Ночное небо -->
        <div class="sky">

            <div class="stars">
                <span class="star s1"></span>
                <span class="star s2"></span>
                <span class="star s3"></span>
                <span class="star s4"></span>
                <span class="star s5"></span>
                <span class="star s6"></span>
                <span class="star s7"></span>
                <span class="star s8"></span>
                <span class="star s9"></span>
                <span class="star s10"></span>
                <span class="star s11"></span>
                <span class="star s12"></span>
            </div>

            <div class="moon">
                <span class="crater c1"></span>
                <span class="crater c2"></span>
                <span class="crater c3"></span>
            </div>

            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>

        </div>


        <!-- Дальний город -->
        <div class="city far-city">

            <div class="building b1"></div>
            <div class="building b2"></div>
            <div class="building b3"></div>
            <div class="building b4"></div>
            <div class="building b5"></div>
            <div class="building b6"></div>
            <div class="building b7"></div>
            <div class="building b8"></div>
            <div class="building b9"></div>
            <div class="building b10"></div>

        </div>


        <!-- Передний город -->
        <div class="city front-city">

            <div class="building fb1"></div>
            <div class="building fb2"></div>
            <div class="building fb3"></div>
            <div class="building fb4"></div>
            <div class="building fb5"></div>
            <div class="building fb6"></div>
            <div class="building fb7"></div>
            <div class="building fb8"></div>

        </div>


        <!-- Девушка -->
        <div class="character">

            <img
                src="girl.png"
                alt="Alt girl with electric guitar"
                class="girl"
            >

        </div>


        <!-- Интерфейс тюнера -->
        <section class="tuner">

            <h1>🎸 GUITAR TUNER</h1>

            <p class="subtitle">
                STANDARD TUNING
            </p>


            <!-- Выбор струны -->
            <div class="strings">

                <button
                    class="string-button"
                    data-note="E2"
                >
                    E
                    <small>82.4 Hz</small>
                </button>

                <button
                    class="string-button"
                    data-note="A2"
                >
                    A
                    <small>110 Hz</small>
                </button>

                <button
                    class="string-button"
                    data-note="D3"
                >
                    D
                    <small>146.8 Hz</small>
                </button>

                <button
                    class="string-button"
                    data-note="G3"
                >
                    G
                    <small>196 Hz</small>
                </button>

                <button
                    class="string-button"
                    data-note="B3"
                >
                    B
                    <small>246.9 Hz</small>
                </button>

                <button
                    class="string-button"
                    data-note="E4"
                >
                    E
                    <small>329.6 Hz</small>
                </button>

            </div>


            <!-- Главный дисплей -->
            <div class="display">

                <div
                    id="selected-note"
                    class="selected-note"
                >
                    —
                </div>

                <div
                    id="note"
                    class="note"
                >
                    —
                </div>

                <div
                    id="frequency"
                    class="frequency"
                >
                    — Hz
                </div>


                <div class="meter">

                    <div class="meter-center"></div>

                    <div
                        id="marker"
                        class="marker"
                    ></div>

                </div>


                <div
                    id="tuning-status"
                    class="tuning-status"
                >
                    Выбери струну
                </div>

            </div>


            <!-- Микрофон -->
            <button
                id="mic-button"
                class="mic-button"
            >
                🎤 НАСТРОИТЬ
            </button>


            <div
                id="status"
                class="status"
            >
                Микрофон выключен
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
